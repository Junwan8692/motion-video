          // grain-overlay keyframes (0.5s cycle, steps(1)) as discrete sets every 0.05s
          var GX = [0, -5, -10, 5, -5, -10, 15, 0, -15, 10];
          var GY = [0, -5, 5, -10, 15, 5, 0, 10, 0, 5];
          for (var i = 1; i * 0.05 < T.end; i++) {
            tl.set(grainTex, { xPercent: GX[i % 10], yPercent: GY[i % 10] }, +(i * 0.05).toFixed(3));
          }

          // ---------- palace: ghost at t = 0 → clip-path wipe L→R over 0.0–0.9 with burin hairline + spotlight ----------
          tl.to(palaceImg, { clipPath: "inset(0% 0% 0% 0%)", duration: T.wipe, ease: "power1.inOut" }, 0);
          tl.to(hair, { x: 1344, duration: T.wipe, ease: "power1.inOut" }, 0);
          tl.to(hair, { autoAlpha: 0.8, duration: 0.1, ease: "power1.out" }, 0);
          tl.to(hair, { autoAlpha: 0, duration: 0.15, ease: "power1.in" }, 0.75);
          tl.to(spot, { x: 1344, duration: T.wipe, ease: "power1.inOut" }, 0);
          tl.to(spot, { autoAlpha: 1, duration: 0.15, ease: "sine.out" }, 0);
          tl.to(spot, { autoAlpha: 0, duration: 0.2, ease: "sine.in" }, 0.8);
          // beat-stepped push-in on the hits (replaces the old slow zoom)
          [[T.coin, 1.012], [T.cut, 1.024], [T.barV, 1.036], [T.slam, 1.048]].forEach(function (s) {
            tl.to(palace, { scale: s[1], duration: 0.12, ease: "power3.out" }, s[0]);
          });
          // the cut drops the palace to 0.28 so the copy reads over it (0 ms, no recede)
          tl.set(palace, { opacity: 0.28 }, T.cut);

          // ---------- knots: swing in from beyond the top corners (0.0–0.325), then sway on every grid beat ----------
          // amplitudes decay to ~2° by the 2.531 slam so the left tassel barely moves behind the copy
          function sway(el, amps) {
            for (var k = 0; k < amps.length; k++) {
              tl.to(
                el,
                { rotation: amps[k], duration: +(SWAY[k + 1] - SWAY[k]).toFixed(3), ease: "sine.inOut" },
                SWAY[k],
              );
            }
          }
          sway(knotL, [-22, 13, -8, 6, -4.5, 3.5, -3, 2.5, -2, 1.5]);
          sway(knotR, [20, -12, 7, -5.5, 4, -3.2, 2.8, -2.2, 1.8, -1.4]);

          // ---------- g1: the gold dot (·, heaven) falls 0.0 → 0.627 ----------
          tl.to(dot, { y: 0, duration: T.coin, ease: "power2.in" }, 0);

          // ---------- 0.627 hit: the dot becomes the coin (0 ms swap + gold flash) ----------
          tl.set(dot, { autoAlpha: 0 }, T.coin);
          tl.set(disc, { autoAlpha: 1 }, T.coin);
          tl.to(disc, { scale: 1.08, duration: 0.14, ease: "expo.out" }, T.coin);
          tl.to(disc, { autoAlpha: 0, duration: 0.12, ease: "power1.in" }, T.coin + 0.1);
          tl.set(coin1, { autoAlpha: 1 }, T.coin);
          tl.to(coin1, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.6)" }, T.coin);
          tl.set(bloom1, { autoAlpha: 1 }, T.coin);
          tl.to(bloom1, { scale: 1, duration: 0.3, ease: "power2.out" }, T.coin);
          tl.to(bloom1, { autoAlpha: 0, duration: 0.24, ease: "power1.in" }, T.coin + 0.06);
          tl.set(streak1, { autoAlpha: 1 }, T.coin);
          tl.to(streak1, { scaleX: 1, duration: 0.2, ease: "expo.out" }, T.coin);
          tl.to(streak1, { autoAlpha: 0, duration: 0.2, ease: "power2.in" }, T.coin + 0.1);
          tl.set(ring1, { autoAlpha: 0.8 }, T.coin);
          tl.to(ring1, { scale: 1, duration: 0.3, ease: "power2.out" }, T.coin);
          tl.to(ring1, { autoAlpha: 0, duration: 0.22, ease: "power1.in" }, T.coin + 0.08);
          tl.to(halo1, { autoAlpha: 0.55, scale: 1, duration: 0.2, ease: "power2.out" }, T.coin);

          // ---------- 0.952 coin pulse ----------
          tl.set(coin1, { scale: 1.08 }, T.pulse);
          tl.to(coin1, { scale: 1, duration: 0.22, ease: "power2.out" }, T.pulse);
          tl.set(halo1, { autoAlpha: 0.9, scale: 1.1 }, T.pulse);
          tl.to(halo1, { autoAlpha: 0.5, scale: 1, duration: 0.26, ease: "sine.out" }, T.pulse);
          tl.set(ring2, { autoAlpha: 0.55 }, T.pulse);
          tl.to(ring2, { scale: 0.8, duration: 0.28, ease: "power2.out" }, T.pulse);
          tl.to(ring2, { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, T.pulse + 0.06);

          // ---------- 1.277 cut → g2 (0 ms swap; shared layers keep moving) ----------
          tl.set(g1, { autoAlpha: 0 }, T.cut);
          tl.set(g2, { autoAlpha: 1 }, T.cut);
          // ㅡ (earth): paper bar fills left → right, fast, threading the coin's square hole
          tl.to(barH, { scaleX: 1, duration: 0.22, ease: "expo.out" }, T.cut);
          // the coin has jumped to the right third: it lands with a short left → right follow-through
          tl.to(coinWrap2, { x: 0, duration: 0.2, ease: "power3.out" }, T.cut);
          tl.to(coin2, { scale: 1, duration: 0.24, ease: "power3.out" }, T.cut);
          // the bar tip reaches the hole ~0.04 s in → the coin kicks
          tl.to(coinWrap2, { rotation: 8, duration: 0.04, ease: "power2.out" }, 1.319);
          tl.to(coinWrap2, { rotation: 0, duration: 0.3, ease: "elastic.out(1, 0.45)" }, 1.359);
          // the coin keeps time on the in-between grid beats
          [1.579, 2.206].forEach(function (b) {
            tl.set(coin2, { scale: 1.06 }, b);
            tl.to(coin2, { scale: 1, duration: 0.2, ease: "power2.out" }, b);
          });

          // ---------- 1.904 ㅣ (human): paper bar drops top → bottom through the coin ----------
          tl.to(barV, { scaleY: 1, duration: 0.2, ease: "expo.out" }, T.barV);
          tl.to(coinWrap2, { y: 7, rotation: -6, duration: 0.04, ease: "power2.out" }, 1.919);
          tl.to(coinWrap2, { y: 0, rotation: 0, duration: 0.3, ease: "elastic.out(1, 0.45)" }, 1.959);

          // ---------- 2.531 braam-punch: "1446 → 2026" + "제580돌 / 한글날" slam in together (0 ms) ----------
          // both blocks scale 1.2 → 1 away from the gap between them (years from its bottom, title from its top)
          tl.set([y1, y2, arrow], { autoAlpha: 1 }, T.slam);
          tl.set(chars, { autoAlpha: 1 }, T.slam);
          tl.to([years, title], { scale: 1, duration: 0.16, ease: "expo.out" }, T.slam);
          tl.to(arrow, { scaleX: 1, duration: 0.14, ease: "power3.out" }, T.slam);
          // the impact answers on the coin and both strokes
          tl.set(coin2, { scale: 1.12 }, T.slam);
          tl.to(coin2, { scale: 1, duration: 0.24, ease: "power2.out" }, T.slam);
          tl.set(bloom2, { autoAlpha: 1 }, T.slam);
          tl.to(bloom2, { scale: 1, duration: 0.3, ease: "power2.out" }, T.slam);
          tl.to(bloom2, { autoAlpha: 0, duration: 0.24, ease: "power1.in" }, T.slam + 0.06);
          tl.set(halo2, { autoAlpha: 1 }, T.slam);
          tl.to(halo2, { autoAlpha: 0.6, duration: 0.3, ease: "sine.out" }, T.slam);
          tl.set([barH, barV], { backgroundColor: "#F0DA7C" }, T.slam);
          tl.to([barH, barV], { backgroundColor: "#E9E5DB", duration: 0.28, ease: "power1.out" }, T.slam + 0.04);

          // ---------- 2.856 haze sheen across the title (0.3 s), then hold to the cut ----------
          var SHEEN_OUT = 3.156; // 2.856 + 0.26 + 1 × 0.04 stagger: band has left the text; solid-paper title returns
          tl.set(title, { autoAlpha: 0 }, T.sheen);
          tl.set(sheen, { autoAlpha: 1 }, T.sheen);
          tl.to(sheenLines, { backgroundPosition: "0% 0%", duration: 0.26, ease: "power2.inOut", stagger: 0.04 }, T.sheen);
          tl.set(sheen, { autoAlpha: 0 }, SHEEN_OUT);
          tl.set(title, { autoAlpha: 1 }, SHEEN_OUT);

          // pin: the timeline ends exactly at the frame span (every tween above ends ≤ 3.181)
          tl.set(grainTex, { xPercent: GX[4], yPercent: GY[4] }, T.end);

          window.__timelines = window.__timelines || {};
          window.__timelines["01-intro"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
