          gsap.set([yeoksi, S1.w, S2.w, hl1], { autoAlpha: 0 });
          gsap.set(hangul, { autoAlpha: 1 });
          gsap.set([yeoksi, S1.w, S2.w, yeonmo], { "--rgb": "6px" });
          gsap.set(hangul, { "--rgb": SLAM0.rgb[0] + "px" });
          gsap.set(yeoksi, { scale: 1, transformOrigin: "50% 50%" });
          gsap.set(hangul, { scale: SLAM0.scale, transformOrigin: "50% 50%" });
          gsap.set([S1.w, S2.w], { scale: 1, transformOrigin: "41% 50%" });
          gsap.set([S1.sg, S2.sg], { x: 0, y: 0, scale: 1, transformOrigin: "0% 0%" });
          gsap.set([S1.sa, S2.sa], { x: 0 });
          gsap.set([S1.bar, S2.bar], { scaleX: 0, transformOrigin: "0% 50%" });
          gsap.set(hl1, { y: px(16) });
          gsap.set([cam2, drift2, line3], { x: 0, y: 0 });
          gsap.set(cam1, { x: px(SLAM0.shake[0]), y: px(SLAM0.shake[1] * 0.5) });
          gsap.set(hl2, { x: px(66), y: 0, scale: 1, transformOrigin: "0% 0%" });
          gsap.set(m2, { x: px(40), y: 0, scale: 1, transformOrigin: "0% 0%" });
          gsap.set(bl2, { x: px(80), y: 0, scale: 1, transformOrigin: "0% 0%" });
          gsap.set(hlTwo, { scale: 1, transformOrigin: "50% 100%" });
          gsap.set(copyChars, { y: px(4.6) });
          gsap.set(yeonSy, { autoAlpha: 0, y: 0, scale: 1, transformOrigin: "50% 60%" });
          gsap.set(cam3, { scale: 1, transformOrigin: "50% 50%" });

          var tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

          function ft(el, from, to, t) {
            to.immediateRender = false;
            tl.fromTo(el, from, to, t);
          }
          function set(el, v, t) {
            tl.set(el, v, t);
          }
          // screen-shake: 0ms steps, then home
          function shake(el, t, amps) {
            for (var i = 0; i < amps.length; i++) {
              set(el, { x: px(amps[i]), y: px(amps[(i + 1) % amps.length] * 0.5) }, t + i * 0.033);
            }
            set(el, { x: 0, y: 0 }, t + amps.length * 0.033);
          }
          // chromatic-split: stepped RGB fringe offsets (px), then rest
          function chroma(el, t, seq, rest) {
            for (var i = 0; i < seq.length; i++) {
              set(el, { "--rgb": seq[i] + "px" }, t + i * 0.045);
            }
            set(el, { "--rgb": (rest || 6) + "px" }, t + seq.length * 0.045);
          }

          // ---- group swaps (0ms) ----
          set(g1, { autoAlpha: 0 }, A.cut12);
          set(g2, { autoAlpha: 1 }, A.cut12);
          set(g2, { autoAlpha: 0 }, A.cut23);
          set(g3, { autoAlpha: 1 }, A.cut23);

          // ---- g1 ----
          // 0.000 (3.181) system-replace: sun ground + 한글날엔 are up on the first frame; the slam settles
          ft(hangul, { scale: SLAM0.scale }, { scale: 1, duration: 0.34, ease: "expo.out" }, A.hangul);
          chroma(hangul, A.hangul, SLAM0.rgb);
          shake(cam1, A.hangul, SLAM0.shake);

          // 0.975 (4.156) 역시 — HL pair snaps up BEHIND the type into the 역|시 gap (vertical path, never across 시)
          set(hangul, { autoAlpha: 0 }, A.yeoksi);
          set([yeoksi, hl1], { autoAlpha: 1 }, A.yeoksi);
          ft(yeoksi, { scale: 1.06 }, { scale: 1, duration: 0.32, ease: "expo.out" }, A.yeoksi);
          chroma(yeoksi, A.yeoksi, [22, 11, 17, 8]);
          ft(hl1, { y: px(16) }, { y: 0, duration: 0.34, ease: "power3.out" }, A.yeoksi);
          // 1.556 (4.737) snare — fringe tick
          chroma(yeoksi, A.tick, [14, 8]);

          // 1.927 (5.108) 사극
          set([yeoksi, hl1], { autoAlpha: 0 }, A.sageuk);
          shake(cam1, A.sageuk, [1.0, -0.8, 0.6, -0.45, 0.28, -0.12]);

          // 사극 → the ㅡ primes in beat steps (2.554 jut, 2.879 jut + 0.325 s push) → 3.204 downbeat:
          // bar stretches L→R while the view whip-pans. (scaleX .13 / .16 / .2 reach 81.4 / 84.2 / 88cqw; the stroke end is NOT measured, est. ~78-79cqw)
          // Built identically on the g1 copy and the g2 copy so the 3.204 swap is seamless.
          function strokeSeq(S) {
            set(S.w, { autoAlpha: 1 }, A.sageuk);
            ft(S.w, { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "expo.out" }, A.sageuk);
            chroma(S.w, A.sageuk, [22, 11, 17, 8]);
            set(S.bar, { scaleX: 0.13 }, A.riser);
            chroma(S.w, A.riser, [12, 8]);
            set(S.bar, { scaleX: 0.16 }, A.riser2);
            ft(S.bar, { scaleX: 0.16 }, { scaleX: 0.2, duration: A.stretch - A.riser2, ease: "power2.in" }, A.riser2);
            chroma(S.w, A.riser2, [10, 7]);
            ft(S.bar, { scaleX: 0.2 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, A.stretch);
            ft(S.sg, { x: 0 }, { x: px(-39), duration: 0.35, ease: "power3.out" }, A.stretch);
            ft(S.sa, { x: 0 }, { x: px(-14), duration: 0.35, ease: "power2.in" }, A.stretch);
            chroma(S.w, A.stretch, [24, 12, 18, 9]);
          }
          strokeSeq(S1);
          strokeSeq(S2);

          // ---- g2 ----
          // 3.204 lineup snaps in from off-screen right with the pan (HL + M behind the bar, BL in front;
          // BL's left edge stays right of 극's right edge at every moment of the pan)
          ft(hl2, { x: px(66) }, { x: 0, duration: 0.34, ease: "power3.out" }, A.cut12);
          ft(bl2, { x: px(80) }, { x: 0, duration: 0.34, ease: "power3.out" }, A.cut12 + 0.06);
          ft(m2, { x: px(40) }, { x: 0, duration: 0.32, ease: "power3.out" }, A.cut12 + 0.12);

          // 3.854 (7.035) SURGE shake
          shake(cam2, A.shake, [1.0, -0.8, 0.6, -0.45, 0.3, -0.15, 0.06]);
          chroma(S2.w, A.shake, [22, 10, 16, 8]);
          // 4.087 (7.268) snare — fringe tick
          chroma(S2.w, A.snare, [14, 8]);

          // 4.481 (7.662) accent → 4.806: bar thickens to the g3 bar (16.5 / 6.4cqw), 극 exits left,
          // figures snap to their g3 lineup geometry (no drift to compensate) → the 4.806 swap is invisible
          chroma(S2.w, A.accent, [18, 9]);
          var E = { duration: A.cut23 - A.accent, ease: "power3.out" };
          ft(S2.sg, { x: px(-39), y: 0, scale: 1 }, Object.assign({ x: px(-112), y: px(-8.0333), scale: 4 / 3 }, E), A.accent);
          ft(hl2, { x: 0, y: 0, scale: 1 }, Object.assign({ x: px(-30), y: px(0.3), scale: 20.5 / 31 }, E), A.accent);
          ft(bl2, { x: 0, y: 0, scale: 1 }, Object.assign({ x: px(-9), y: px(-8.2), scale: 20.5 / 46 }, E), A.accent);
          ft(m2, { x: 0, y: 0, scale: 1 }, Object.assign({ x: px(-8), y: px(0.3), scale: 20 / 27 }, E), A.accent);

          // ---- g3 ----
          // 4.806 (7.987) HL-pair-2 joins the lineup; 스물여덟 자에 새긴 sets into the bar
          ft(hlTwo, { scale: 1.07 }, { scale: 1, duration: 0.32, ease: "power3.out" }, A.cut23);
          copyChars.forEach(function (c, i) {
            ft(c, { y: px(4.6) }, { y: 0, duration: 0.3, ease: "power3.out" }, A.cut23 + i * 0.022);
          });

          // 5.758 (8.939) 연모와 칼끝 slams lower left, syllable by syllable; the breath holds it still until 6.734
          yeonSy.forEach(function (s, i) {
            var t = A.yeonmo + i * 0.05;
            set(s, { autoAlpha: 1 }, t);
            ft(s, { y: px(-4.3), scale: 1.1 }, { y: 0, scale: 1, duration: 0.32, ease: "expo.out" }, t);
          });
          chroma(yeonmo, A.yeonmo, [20, 10, 15, 8]);

          // 6.734 (9.915) primes the cut: push-in accelerating into 7.059 + fringe tension
          ft(cam3, { scale: 1 }, { scale: 1.035, duration: A.end - A.prime, ease: "power2.in" }, A.prime);
          chroma(yeonmo, A.prime, [20, 9, 15], 10);
          set(yeonmo, { "--rgb": "18px" }, A.end - 0.1);

          // ---- grain: seeded 12 fps jitter across the whole frame ----
          function mulberry32(a) {
            return function () {
              a |= 0;
              a = (a + 0x6d2b79f5) | 0;
              var t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          var rnd = mulberry32(0x2f02);
          gsap.set(grain, { x: px((rnd() - 0.5) * 10), y: px((rnd() - 0.5) * 6) });
          for (var k = 1; k / 12 < A.end; k++) {
            set(grain, { x: px((rnd() - 0.5) * 10), y: px((rnd() - 0.5) * 6) }, Math.round((k / 12) * 1000) / 1000);
          }

          window.__timelines = window.__timelines || {};
          window.__timelines[ID] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
