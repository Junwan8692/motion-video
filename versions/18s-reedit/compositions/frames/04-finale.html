          // logo placeholder + coin (천 · the gold dot) land together on the 16.533 snare: both appear in 0ms.
          // Logo stamps from 1.12 (right edge ≤ 1112.8px, clear of the coin's 1113.6px left edge at every frame).
          // The coin lands like a tossed coin: a rotationY flip settling face-on. No horizontal travel — a roll
          // would cross "레진 로고" — and rotationY only narrows its box, so it never overlaps the logo.
          tl.set(logo, { autoAlpha: 1 }, T.logo);
          tl.fromTo(logo, { scale: 1.12 }, { scale: 1, duration: 0.2, ease: "power4.out" }, T.logo);
          tl.set(coin, { autoAlpha: 1 }, T.logo);
          tl.fromTo(coin, { rotationY: 540 }, { rotationY: 0, duration: 0.3, ease: "power4.out" }, T.logo);
          rgbTick(T.logo);

          // grain steps at 15 fps until the hard stop, then holds still
          var rnd = mulberry32(40418);
          for (var k = 0; k / 15 <= T.stop; k++) {
            tl.set(
              grain,
              {
                xPercent: Math.round((rnd() * 30 - 15) * 10) / 10,
                yPercent: Math.round((rnd() * 30 - 15) * 10) / 10,
              },
              k / 15,
            );
          }

          // 17.0 hard stop → held frame to 18.47; idempotent set so the timeline spans exactly 5.676s
          tl.set(g2, { autoAlpha: 1 }, T.end);

          window.__timelines = window.__timelines || {};
          window.__timelines["04-finale"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
