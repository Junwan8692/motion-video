          tl.to(hair, { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, WIPE_AT + WIPE - 0.3);
          tl.to(spot, { x: 1344, duration: WIPE, ease: "power1.inOut" }, WIPE_AT);
          tl.to(spot, { autoAlpha: 1, duration: 0.5, ease: "sine.out" }, WIPE_AT);
          tl.to(spot, { autoAlpha: 0, duration: 0.45, ease: "sine.in" }, T.flare1 - 0.3);
          // negative-space hold: the palace recedes so the coin reads alone; the cut drops it to 0.28
          tl.to(palace, { opacity: 0.62, duration: 0.9, ease: "sine.inOut" }, T.coin - 0.35);
          tl.set(palace, { opacity: 0.28 }, T.cut);

          // ---------- knots: swing in from beyond the top corners, then a 2-beat pendulum sway ----------
          function swing(el, keys) {
            keys.forEach(function (k) {
              tl.to(
                el,
                { rotation: k[2], duration: +(k[1] - k[0]).toFixed(3), ease: k[3] || "sine.inOut" },
                k[0],
              );
            });
          }
          tl.set(knotL, { autoAlpha: 1 }, 0.2);
          tl.set(knotR, { autoAlpha: 1 }, 0.3);
          swing(knotL, [
            [0.2, 1.1, -30],
            [1.1, 2.2, 15],
            [2.2, 2.98, -8],
            [2.98, 4.04, 6],
            [4.04, 5.294, -4],
            [5.294, 6.618, 4.5],
            [6.618, 7.918, -4],
            [7.918, 9.195, 4],
            [9.195, 10.472, -4.5],
            [10.472, 11.773, 4],
            [11.773, 13.026, -4],
          ]);
          swing(knotR, [
            [0.3, 1.2, 27],
            [1.2, 2.26, -13],
            [2.26, 3.0, 7],
            [3.0, 4.04, -5],
            [4.04, 5.294, 4],
            [5.294, 6.618, -4.5],
            [6.618, 7.918, 4],
            [7.918, 9.195, -3.5],
            [9.195, 10.472, 4],
            [10.472, 11.773, -4],
            [11.773, 13.026, 3.5],
          ]);

          // ---------- g1: the gold dot (·, heaven) drops to centre, landing on 0.65 ----------
          tl.set(dot, { autoAlpha: 1 }, 0.33);
          tl.to(dot, { y: 0, duration: T.drop - 0.33, ease: "power2.in" }, 0.33);
          tl.set(dot, { scaleX: 1.42, scaleY: 0.64 }, T.drop);
          tl.to(dot, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.45)" }, T.drop);
          tl.to(dot, { y: -4, duration: 0.52, ease: "sine.inOut", repeat: 3, yoyo: true }, 1.3);
          // landing ripple
          tl.set(ring1, { autoAlpha: 0.8 }, T.drop);
          tl.to(ring1, { scale: 1, duration: 1.35, ease: "power2.out" }, T.drop);
          tl.to(ring1, { autoAlpha: 0, duration: 1.1, ease: "power1.in" }, T.drop + 0.25);
          tl.set(ring2, { autoAlpha: 0.5 }, T.drop + 0.16);
          tl.to(ring2, { scale: 0.8, duration: 1.3, ease: "power2.out" }, T.drop + 0.16);
          tl.to(ring2, { autoAlpha: 0, duration: 1.0, ease: "power1.in" }, T.drop + 0.4);
          // halo breath
          tl.to(halo1, { autoAlpha: 0.55, scale: 1, duration: 0.5, ease: "power2.out" }, T.drop);
          tl.to(halo1, { autoAlpha: 0.38, duration: 0.65, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.15);

          // ---------- 3.413 the dot flares; by 4.667 it has become the coin ----------
          tl.to(dot, { scale: 1.55, duration: 0.11, ease: "power2.out" }, T.flare1);
          tl.set(bloom1, { autoAlpha: 1 }, T.flare1);
          tl.to(bloom1, { scale: 1, duration: 0.85, ease: "power2.out" }, T.flare1);
          tl.to(bloom1, { autoAlpha: 0, duration: 0.7, ease: "power1.in" }, T.flare1 + 0.15);
          tl.set(streak1, { autoAlpha: 1 }, T.flare1);
          tl.to(streak1, { scaleX: 1, duration: 0.32, ease: "expo.out" }, T.flare1);
          tl.to(streak1, { autoAlpha: 0, duration: 0.55, ease: "power2.in" }, T.flare1 + 0.18);
          tl.to(halo1, { autoAlpha: 0.95, scale: 1.15, duration: 0.14, ease: "power2.out" }, T.flare1);
          tl.to(halo1, { autoAlpha: 0.5, scale: 1, duration: 1.0, ease: "sine.inOut" }, T.flare1 + 0.2);
          var SWAP = 3.53; // popped dot (28px × 1.55) == disc (212px × 0.2)
          tl.set(dot, { autoAlpha: 0 }, SWAP);
          tl.set(disc, { autoAlpha: 1 }, SWAP);
          tl.to(disc, { scale: 1, duration: 0.8, ease: "power3.inOut" }, SWAP);
          tl.to(disc, { autoAlpha: 0, duration: 0.35, ease: "power1.in" }, 4.27);
          tl.to(coin1, { autoAlpha: 1, duration: 0.55, ease: "power1.out" }, 3.98);
          tl.to(coin1, { rotation: 0, scale: 1, duration: T.coin - 3.98, ease: "power2.out" }, 3.98);
          tl.set(coin1, { scale: 1.06 }, T.coin);
          tl.to(coin1, { scale: 1, duration: 0.32, ease: "power2.out" }, T.coin);
          tl.to(coin1, { rotation: 3, duration: T.cut - T.coin - 0.02, ease: "sine.inOut" }, T.coin + 0.01);
          tl.to(halo1, { autoAlpha: 0.8, duration: 0.08, ease: "power2.out" }, T.coin);
          tl.to(halo1, { autoAlpha: 0.45, duration: 0.5, ease: "sine.out" }, T.coin + 0.1);

          // ---------- 5.294 cut → g2 (0 ms swap; shared layers keep moving) ----------
          tl.set(g1, { autoAlpha: 0 }, T.cut);
          tl.set(g2, { autoAlpha: 1 }, T.cut);
          // ㅡ (earth): paper bar fills left → right, threading the coin's square hole
          tl.to(barH, { scaleX: 1, duration: 0.42, ease: "power3.out" }, T.cut);
          tl.to(coin2, { scale: 1, duration: 0.35, ease: "power3.out" }, T.cut);
          tl.to(coinWrap2, { rotation: 8, duration: 0.05, ease: "power2.out" }, 5.445);
          tl.to(coinWrap2, { rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.4)" }, 5.495);
          // ㅣ (human): paper bar fills top → bottom through the coin
          tl.to(barV, { scaleY: 1, duration: 0.42, ease: "power3.out" }, T.barV);
          tl.to(coinWrap2, { y: 7, rotation: -6, duration: 0.05, ease: "power2.out" }, 7.986);
          tl.to(coinWrap2, { y: 0, rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.4)" }, 8.036);
          // the coin keeps time between hits (grid beats)
          [5.968, 6.618, 7.268, 8.545, 9.195, 9.822, 10.472, 11.122, 11.773].forEach(function (b) {
            tl.to(coin2, { scale: 1.04, duration: 0.06, ease: "power2.out" }, b);
            tl.to(coin2, { scale: 1, duration: 0.24, ease: "power2.inOut" }, b + 0.06);
          });

          // ---------- 9.590 "1446 → 2026" ----------
          tl.to(y1, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, T.years);
          tl.set(arrow, { autoAlpha: 1 }, 9.66);
          tl.to(arrow, { scaleX: 1, duration: 0.22, ease: "power2.out" }, 9.66);
          tl.to(y2, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 9.822);

          // ---------- 10.472 "제580돌 / 한글날": kinetic letter-in, then the haze chrome sweep ----------
          tl.to(chars, { autoAlpha: 1, y: 0, duration: 0.55, ease: "back.out(1.7)", stagger: 0.04 }, T.title);
          var SHEEN_IN = 11.31; // all letters settled (10.472 + 7 × 0.04 + 0.55 = 11.302)
          var SHEEN_OUT = 12.11; // band has left the text; solid-paper title returns
          tl.set(title, { autoAlpha: 0 }, SHEEN_IN);
          tl.set(sheen, { autoAlpha: 1 }, SHEEN_IN);
          tl.to(sheenLines, { backgroundPosition: "0% 0%", duration: 0.72, ease: "power2.inOut", stagger: 0.06 }, SHEEN_IN);
          tl.set(sheen, { autoAlpha: 0 }, SHEEN_OUT);
          tl.set(title, { autoAlpha: 1 }, SHEEN_OUT);

          // ---------- 12.144 coin flare → pre-drop tension into the 13.026 cut ----------
          tl.set(bloom2, { autoAlpha: 1 }, T.flare2);
          tl.to(bloom2, { scale: 1, duration: 0.75, ease: "power2.out" }, T.flare2);
          tl.to(bloom2, { autoAlpha: 0, duration: 0.6, ease: "power1.in" }, T.flare2 + 0.15);
          tl.to(coin2, { scale: 1.14, duration: 0.07, ease: "power2.out" }, T.flare2);
          tl.to(coin2, { scale: 1, duration: 0.45, ease: "power2.out" }, T.flare2 + 0.07);
          tl.to(halo2, { autoAlpha: 1, duration: 0.1, ease: "power2.out" }, T.flare2);
          tl.to(halo2, { autoAlpha: 0.7, duration: 0.22, ease: "sine.out" }, T.flare2 + 0.12);
          tl.to(halo2, { autoAlpha: 1, duration: 0.5, ease: "power2.in" }, 12.5);
          tl.to(coinWrap2, { scale: 1.09, duration: 0.72, ease: "power2.in" }, 12.3);
          tl.to([barH, barV], { backgroundColor: "#F0DA7C", duration: 0.06, ease: "none" }, T.flare2);
          tl.to([barH, barV], { backgroundColor: "#E9E5DB", duration: 0.5, ease: "power1.out" }, T.flare2 + 0.08);

          window.__timelines = window.__timelines || {};
          // fast cut: the 40 s timeline plays 2.2222x inside an outer timeline (user: 40s를 18초로 빠르게)
          var fast = gsap.timeline({ paused: true });
          fast.add(tl.paused(false).timeScale(2.222222), 0);
          window.__timelines["01-intro"] = fast;
          fast.seek(0);
        })();
      </script>
    </template>
