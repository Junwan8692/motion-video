      <script>
        (function () {
          "use strict";

          var root =
            document.querySelector('#stage[data-composition-id="03-ganada"]') ||
            document.querySelector('[data-composition-id="03-ganada"]') ||
            document;
          function byId(id) {
            return root.querySelector("#" + id) || document.getElementById(id);
          }

          // Frame-local anchors: local = track − 10.240 (audiomap.json, short version, span 10.240–12.794)
          var T = {
            p1: 0.0, //     10.240 downbeat — column 1 (sun) slams in: 가 punch, HL pair rises, ink brush wipes
            coin: 0.093, // 10.333 perc — the coin rolls in
            c1: 0.255, //   10.495 snare — "단 1코인" + 예시
            p2: 0.627, //   10.867 beat — column 2 (ember): 나 punch, ink card flips in, BL pair rises
            c2: 0.882, //   11.122 hihat — "100% 코인백" + 예시
            p3: 1.231, //   11.471 strong snare — column 3 (ink): 다 punch, ember splash, M-group rises
            c3: 1.533, //   11.773 snare — "특별편 OPEN" + 예시
            hold: 1.76, //  12.000 hard stop — silence: every tween (grain included) is done; the triptych freezes
            end: 2.554 //   12.794 frame end
          };

          var tl = gsap.timeline({ paused: true });

          function mulberry32(a) {
            return function () {
              a |= 0;
              a = (a + 0x6d2b79f5) | 0;
              var t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          function showAt(el, t) {
            tl.set(el, { autoAlpha: 1 }, t);
          }
          function hideAt(el, t) {
            tl.set(el, { autoAlpha: 0 }, t);
          }
          // braam-punch: the syllable lands oversized and slams to rest with a short overshoot thud (0.3s)
          function slam(el, t, peak) {
            tl.fromTo(el, { scale: peak }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t);
          }
          // chromatic split: 0ms fringe jumps, then ease back to the 4px rest fringe (continuous chain)
          function fringe(el, t0, steps) {
            for (var i = 0; i < steps.length; i++) {
              tl.set(el, { "--f03-rx": steps[i][1] + "px" }, t0 + steps[i][0]);
            }
            var last = steps[steps.length - 1];
            tl.fromTo(
              el,
              { "--f03-rx": last[1] + "px" },
              { "--f03-rx": "4px", duration: 0.3, ease: "power2.out", immediateRender: false },
              t0 + last[0] + 0.066
            );
          }
          // content-swap: 0ms appearance plus a short left→right settle
          function pop(el, t) {
            hideAt(el, 0);
            showAt(el, t);
            tl.fromTo(el, { x: -28 }, { x: 0, duration: 0.2, ease: "power3.out" }, t);
          }
          // figure entrance: rises from below its rest (never above it), so it never reaches the copy band
          function rise(el, t) {
            tl.fromTo(el, { x: -40, y: 140 }, { x: 0, y: 0, duration: 0.3, ease: "power3.out" }, t);
          }

          // ---- columns: 0ms slams, left → right, accumulate (never hidden again) ----
          var g1 = byId("f03-g1");
          var g2 = byId("f03-g2");
          var g3 = byId("f03-g3");
          showAt(g1, T.p1);
          hideAt(g2, 0);
          hideAt(g3, 0);
          showAt(g2, T.p2);
          showAt(g3, T.p3);

          var gly1 = byId("f03-g1-glyph");
          var gly2 = byId("f03-g2-glyph");
          var gly3 = byId("f03-g3-glyph");
          tl.set([gly1, gly2, gly3], { "--f03-rx": "4px" }, 0);

          // ---- column 1 · 가 — punch, HL pair, ink brush behind it, coin, copy ----
          slam(byId("f03-g1-syl"), T.p1, 1.2);
          fringe(gly1, T.p1, [[0, 16], [0.066, 6], [0.133, 12]]);
          rise(byId("f03-g1-hlwrap"), T.p1);

          var brush = byId("f03-g1-brush");
          tl.set(brush, { rotation: -13 }, 0);
          tl.fromTo(
            brush,
            { clipPath: "inset(0% 100% 0% 0%)" },
            { clipPath: "inset(0% 0% 0% 0%)", duration: 0.25, ease: "power2.out" },
            T.p1
          );

          var coin = byId("f03-g1-coinwrap");
          hideAt(coin, 0);
          showAt(coin, T.coin);
          tl.fromTo(
            coin,
            { x: -120, rotation: -180, scale: 1.25 },
            { x: 0, rotation: 0, scale: 1, duration: 0.3, ease: "power3.out" },
            T.coin
          );
          pop(byId("f03-g1-cw"), T.c1);

          // ---- column 2 · 나 — punch, ink card flip (ref-09 navy card on red), BL pair, copy ----
          slam(byId("f03-g2-syl"), T.p2, 1.2);
          fringe(gly2, T.p2, [[0, 16], [0.066, 6], [0.133, 12]]);

          var card = byId("f03-g2-p1");
          tl.set(card, { transformOrigin: "0% 50%", transformPerspective: 1400 }, 0);
          tl.fromTo(card, { rotationY: -75 }, { rotationY: 0, duration: 0.3, ease: "power3.out" }, T.p2);
          rise(byId("f03-g2-blwrap"), T.p2);
          pop(byId("f03-g2-cw"), T.c2);

          // ---- column 3 · 다 — punch, ember splash burst behind the M-group, copy ----
          slam(byId("f03-g3-syl"), T.p3, 1.2);
          fringe(gly3, T.p3, [[0, 18], [0.066, 6], [0.133, 14]]);

          tl.fromTo(
            byId("f03-g3-splashwrap"),
            { scale: 0.82, rotation: -11 },
            { scale: 1, rotation: -6, duration: 0.24, ease: "expo.out" },
            T.p3
          );
          rise(byId("f03-g3-mwrap"), T.p3);
          pop(byId("f03-g3-cw"), T.c3);

          // ---- grain: seeded offsets stepped at 12 fps; stops at the 12.000 hard stop (true freeze) ----
          var grain = byId("f03-grain-tex");
          var rnd = mulberry32(0x0325);
          var step = 1 / 12;
          var n = Math.floor(T.hold / step + 1e-6); // 21 → last step at 1.75
          for (var i = 0; i <= n; i++) {
            tl.set(
              grain,
              { x: Math.round((rnd() - 0.5) * 192), y: Math.round((rnd() - 0.5) * 192) },
              Math.round(i * step * 1000) / 1000
            );
          }

          // ---- end anchor: the timeline runs exactly 0 … 2.554 (re-asserts the columns; no visual change) ----
          tl.set([g1, g2, g3], { autoAlpha: 1 }, T.end);

          window.__timelines = window.__timelines || {};
          window.__timelines["03-ganada"] = tl;
          tl.seek(0);
        })();
